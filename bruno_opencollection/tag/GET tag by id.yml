info:
  name: GET tag by id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/tags/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: '"{{name}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
