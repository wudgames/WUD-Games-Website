<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" user-scalable=yes />
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="style.css" />
    <title>WUDGames Website</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js"
        integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf"
        crossorigin="anonymous"></script>
</head>

<body id="root">
    <div th:if="${param.original_invalid_uri != null}">
        <p th:text="${param.original_invalid_uri}">Invalid URI</p>
    </div>
    <div th:replace="~{fragments/header ::navbar}">The header should go here</div>
    <div>This should be filter options</div>
    <button hx-target="next .searchresult" hx-get="/api/search" hx-trigger="click">Refresh</button>
    <div class="searchresult tilegrid">
        <div th:each="tiledata: ${generalDisDTOList}">
            <div th:replace="~{fragments/tile :: tile(sometype)}"></div>
        </div>
    </div>
</body>

</html>
