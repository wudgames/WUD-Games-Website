<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" user-scalable=yes />
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="style.css" />
    <title>WUDGames Website</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js"
        integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf"
        crossorigin="anonymous"></script>
</head>

<body th:fragment="searchresult">
    <div>Filter summery will go here</div>
    <div class="tilegrid">

        <div th:each="tiledata: ${generalDisDTOList}" class="overlay">
            <div class="overlay__content">
                <div>
                    <a sec:authorize="hasRole('HOST')">
                        <button>Checkout</button>
                    </a>
                </div>
                <div>
                    <a sec:authorize="hasRole('HOST')">
                        <button>Return</button>
                    </a>
                </div>
                <span
                    th:if="${tiledata instanceof T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO)}"
                    sec:authorize="hasRole('PHYSICAL_INVENTORY_MANAGER')">
                    <div>
                        <a th:href="@{~/manage/inventory/update/{id}(id=${tiledata.id})}">
                            <button>Edit</button>
                        </a>
                    </div>
                    <div>
                        <a>
                            <button>Delete</button>
                        </a>
                    </div>
                </span>
            </div>
            <a th:href="@{~/library/{id}/{name}(id=${tiledata.id},name=${tiledata.name})}">
                <div th:replace="~{fragments/tile :: tile(sometype)}"></div>
            </a>
        </div>
    </div>
</body>

</html>
