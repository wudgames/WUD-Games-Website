<!DOCTYPE html>
<html>

<head xmlns:th="http://www.thymeleaf.org">
  <title>WUDGames Website</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" user-scalable=yes />
  <meta name="robots" content="index,follow">
  <meta name="generator" content="GrapesJS Studio">
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&amp;family=Open+Sans:wght@400;600&amp;display=swap"
    rel="stylesheet" />
</head>

<body>
  <div th:fragment="navbar" class="navbar">
    <a href="/" class="navbar__logo">
      <img src="/images/logo.jpg" alt="Logo" width="70" height="50">
    </a>
    <nav class="navbar__links">
      <a class="navbar__option" href="/library">Library</a>
      <a class="navbar__option">Option 2</a>
      <a class="navbar__option">Option 3</a>
      <div class=navbar__separator></div>
      <a class="media media--flip" id="iavrp3" href="/myuser">
        <div class="content content--oneline">
          <div th:if="${user_name != null}" th:text="${user_name}">User Name</div>
          <div th:if="${user_name == null}">Sign In</div>
        </div>
        <img th:if="${user_name != null}" th:src="${user_profile_picture}" alt="User Profile Picture" width="50"
          height="50" class="img">
      </a>
    </nav>
  </div>
</body>

</html>
